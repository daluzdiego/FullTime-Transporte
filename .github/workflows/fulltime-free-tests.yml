name: FullTime free tests

on:
  push:
    branches:
      - feat/multiempresa-foundation
  pull_request:
    branches:
      - feat/multiempresa-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static and domain tests
        run: npm test
