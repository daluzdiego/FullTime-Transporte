name: Validar sintaxe e integridade estática do Apps Script

on:
  push:
    branches:
      - main
      - feat/agente-ia-entrada-operacoes
      - "planejamento/controle-18-11-2026"
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe de todos os arquivos Apps Script em conjunto
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('.').glob('*.gs'))
          if not files:
              raise SystemExit('Nenhum arquivo .gs encontrado.')
          combined = []
          for path in files:
              combined.append(f'// FILE: {path.name}')
              combined.append(path.read_text(encoding='utf-8'))
          Path('/tmp/all-apps-script.js').write_text('\n'.join(combined), encoding='utf-8')
          print('Arquivos Apps Script:', ', '.join(p.name for p in files))
          PY
          node --check /tmp/all-apps-script.js
      - name: Verificar scripts embutidos em Index.html
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('Index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>', html, flags=re.IGNORECASE)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('Nenhum script inline encontrado para validar.')
          Path('/tmp/Index-inline.js').write_text('\n;\n'.join(inline), encoding='utf-8')
          print(f'Scripts inline encontrados: {len(inline)}')
          PY
          node --check /tmp/Index-inline.js
